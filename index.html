<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>اسأل قبل ما تشتري - سلامة الغذاء 622</title><link rel=icon href=icon-192.png><link rel=manifest href=manifest.webmanifest><meta name=theme-color content="#020617"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#020617;color:#e2e8f0}.header{position:sticky;top:0;z-index:100;background:rgba(2,6,23,.9);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:14px;display:flex;justify-content:space-between;align-items:center}.header b{background:linear-gradient(90deg,#22c55e,#86efac);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn{width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;padding:18px;border-radius:20px;border:0;font-weight:900;font-size:19px;box-shadow:0 10px 30px rgba(34,197,94,.3)}.card{background:linear-gradient(180deg,#1e293b,#0f172a);border:1.5px solid #334155;border-radius:22px;padding:18px;margin-top:14px}.card.eg{border-color:#22c55e;box-shadow:0 0 25px rgba(34,197,94,.2)}.badge{padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;display:inline-block;margin:3px} table{width:100%;border-collapse:collapse;margin-top:14px;background:#020617;border-radius:14px;overflow:hidden} th,td{padding:11px 10px;border-bottom:1px solid #1e293b;text-align:right;font-size:14px} th{background:#0f172a;color:#22c55e}.good{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444} #scanner{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column} #reader{flex:1} input{width:100%;padding:16px;border-radius:16px;background:#0f172a;color:#fff;border:1px solid #334155;margin:12px 0}.source{font-size:12px;color:#64748b;margin-top:8px;border-top:1px dashed #1e293b;padding-top:8px}</style></head><body><div class=header><b>🌍 اسأل قبل ما تشتري - هيئة سلامة الغذاء</b><span style=color:#22c55e;font-size:12px;font-weight:800>622 LIVE</span></div><div style=padding:14px;max-width:650px;margin:0 auto><button class=btn onclick=startScan()>📷 امسح أي باركود - قيمة غذائية كاملة</button><div id=scanner><div id=reader></div><div style=padding:14px;text-align:center;background:#020617;border-top:1px solid #1e293b><p id=scanResult style=color:#22c55e;font-weight:800></p><button onclick=stopScan() style=padding:12px 28px;border-radius:999px;background:#1e293b;color:#fff;border:1px solid #334155>✕ إغلاق</button></div></div><input id=search placeholder="الصق أي باركود مصري 622..." inputmode=numeric oninput=handle(this.value)><div id=count style=color:#22c55e;font-weight:800;margin:8px 0></div><div id=list><div class=card><b>💡 كيف يعمل الموقع النهائي؟</b><br><span style=color:#94a3b8>1- تمسح أي باركود → 2- نجيب بياناته من قاعدة سلامة الغذاء العالمية (3 مليون منتج) → 3- نعرض السعرات والدهون والبروتين والملح والسكر + Nutri-Score + تحذيرات</span></div></div></div><script>
const LOCAL_CACHE=JSON.parse(localStorage.getItem('EG_CACHE')||'{}');function saveCache(c,d){LOCAL_CACHE[c]=d;localStorage.setItem('EG_CACHE',JSON.stringify(LOCAL_CACHE));}
function getCountry(code){code=(code||'').replace(/\D/g,'');let p=code.slice(0,3);if(p==='622')return{flag:'🇪🇬',name:'مصر - منتج مصري 100% - GS1 Egypt',color:'#22c55e',eg:true};if(p==='729')return{flag:'🚫',name:'مقاطعة - غير مصري',color:'#ef4444',eg:false};return{flag:'🌍',name:'مستورد '+p,color:'#94a3b8',eg:false};}
function renderFromOFF(code,product,info){info=info||getCountry(code);let name=product.product_name_ar||product.product_name||'منتج '+code;let brand=product.brands||'غير معروف';let img=product.image_url||'';let nutr=product.nutriments||{};let nutScore=product.nutriscore_grade?product.nutriscore_grade.toUpperCase():null;let nova=product.nova_group||'?';let energy=nutr['energy-kcal_100g']||'?';let fat=nutr.fat_100g;let sat=nutr['saturated-fat_100g'];let sugar=nutr.sugars_100g;let prot=nutr.proteins_100g;let salt=nutr.salt_100g;let fiber=nutr.fiber_100g;
let table=`<table><tr><th>العنصر</th><th>لكل 100جم</th><th>الحالة</th></tr><tr><td>🔥 الطاقة</td><td>${energy} سعرة</td><td></td></tr><tr><td>🥑 دهون</td><td>${fat!=null?fat+' جم':'?'}</td><td></td></tr><tr><td>دهون مشبعة</td><td>${sat!=null?sat+' جم':'?'}</td><td class="${sat>5?'bad':''}">${sat>5?'عالي ⚠️':''}</td></tr><tr><td>🍬 سكر</td><td>${sugar!=null?sugar+' جم':'?'}</td><td class="${sugar>22.5?'bad':''}">${sugar>22.5?'عالي ⚠️':''}</td></tr><tr><td>💪 بروتين</td><td>${prot!=null?prot+' جم':'?'}</td><td class="good"></td></tr><tr><td>🌾 ألياف</td><td>${fiber!=null?fiber+' جم':'?'}</td><td></td></tr><tr><td>🧂 ملح</td><td>${salt!=null?salt+' جم':'?'}</td><td class="${salt>1.5?'bad':''}">${salt>1.5?'عالي ⚠️':''}</td></tr></table>`;
let scores=`<div style=display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px><div style=background:#020617;padding:10px;border-radius:12px;text-align:center;border:1px solid #1e293b><b style=color:#22c55e;font-size:22px>${nutScore||'?'}</b><br><small>Nutri-Score</small></div><div style=background:#020617;padding:10px;border-radius:12px;text-align:center;border:1px solid #1e293b><b style=color:#f59e0b;font-size:22px>${nova}</b><br><small>NOVA</small></div><div style=background:#020617;padding:10px;border-radius:12px;text-align:center><b>🇪🇬</b><br><small>${info.name}</small></div></div>`;
return `<div class="card ${info.eg?'eg':''}"><div><span class=badge style=background:${info.color};color:${info.eg?'#000':'#fff'}>${info.flag} ${info.name}</span><span class=badge style=background:#0f172a;border:1px solid #334155;color:#86efac>${code}</span><span class=badge style=background:#0f172a;border:1px solid #334155>🏢 ${brand}</span></div><h2 style=margin:12px 0 6px>${name}</h2>${img?`<img src="${img}" style=width:100%;max-height:260px;object-fit:contain;background:#fff;border-radius:16px;margin-top:12px>`:''}${scores}${table}<div style=margin-top:12px;background:#020617;padding:12px;border-radius:12px;border:1px dashed ${info.color}><b>💡 تقرير سلامة الغذاء:</b><br>📌 كود الدولة: ${code.slice(0,3)}<br>📌 الشركة: ${code.slice(3,7)}<br>📋 المكونات: ${product.ingredients_text_ar||product.ingredients_text||'غير متوفرة'}</div><div class=source>المصدر: Open Food Facts - قاعدة سلامة الغذاء العالمية</div></div>`;}
function renderInstant(code){code=(code||'').replace(/\D/g,'');if(code.length<8){list.innerHTML='<div class=card>اكتب 8 أرقام</div>';return;}let info=getCountry(code);list.innerHTML=`<div class=card ${info.eg?'eg':''}><span class=badge style=background:${info.color};color:#000>${info.flag} ${info.name}</span><span class=badge style=background:#0f172a;border:1px solid #334155>${code}</span><h3>⏳ جاري جلب القيمة الغذائية من هيئة سلامة الغذاء...</h3><p style=color:#94a3b8>نبحث في 3,000,000 منتج...</p></div>`;count.innerText=`🔍 نبحث عن ${code}...`;fetchOFF(code,info);}
async function fetchOFF(code,info){if(LOCAL_CACHE[code]){list.innerHTML=renderFromOFF(code,LOCAL_CACHE[code],info);count.innerText=`✅ (من الذاكرة) ${code}`;return;}try{let r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);let j=await r.json();if(j.status===1&&j.product){saveCache(code,j.product);list.innerHTML=renderFromOFF(code,j.product,info);count.innerText=`✅ تم الجلب من سلامة الغذاء: ${code} - ${info.flag} ${info.name}`;}else{list.innerHTML=`<div class="card ${info.eg?'eg':''}"><span class=badge style=background:${info.color};color:#000>${info.flag} ${info.name}</span><span class=badge style=background:#0f172a;border:1px solid #334155>${code}</span><h2>منتج جديد برقم ${code}</h2><p>غير موجود في قاعدة سلامة الغذاء، لكنه <b>${info.name}</b>.</p><div style=margin-top:12px;background:#020617;padding:12px;border-radius:12px>📌 كود الدولة: ${code.slice(0,3)}<br>📌 الشركة: ${code.slice(3,7)}</div></div>`;count.innerText=`ℹ️ منتج جديد: ${code}`;}}catch(e){list.innerHTML=`<div class=card eg><span class=badge style=background:#22c55e;color:#000>🇪🇬 ${info.name}</span><span class=badge style=background:#0f172a;border:1px solid #334155>${code}</span><h2>تقرير فوري (بدون نت)</h2></div>`;}}
function handle(v){renderInstant(v);}let qr=null;async function startScan(){scanner.style.display='flex';qr=new Html5Qrcode("reader");await qr.start({facingMode:"environment"},{fps:15,qrbox:{width:300,height:130}},(d)=>{scanResult.innerText='✅ تم: '+d;stopScan();search.value=d;handle(d);},()=>{});}async function stopScan(){if(qr){try{await qr.stop()}catch{}qr=null}scanner.style.display='none';}
handle('6224009210817');
</script></body></html>
