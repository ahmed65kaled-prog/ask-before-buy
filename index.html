<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>كاشير مصري - يعرف الجبنة من الشاي</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#020617;color:#fff}.top{padding:12px;background:#0f172a;border-bottom:2px solid #22c55e;position:sticky;top:0;z-index:10}.btn{width:100%;padding:16px;border-radius:16px;border:0;font-weight:900;font-size:17px;margin-top:8px}.btn-green{background:#22c55e;color:#000}.card{background:#1e293b;border:2px solid #22c55e;border-radius:16px;padding:12px;margin-top:10px}.card.cheese{border-color:#f59e0b;background:linear-gradient(135deg,#1e293b,#451a03)} table{width:100%;font-size:13px;border-collapse:collapse;background:#020617;border-radius:10px;margin-top:8px} th,td{padding:8px;border-bottom:1px solid #1e293b;text-align:right} th{color:#22c55e} #scanner{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column} #reader{flex:1;position:relative}.frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:85%;height:130px;border:2px dashed #22c55e;border-radius:12px}.laser{position:absolute;left:0;right:0;height:2px;background:red;animation:mv 1.5s infinite} @keyframes mv{0%{top:0}50%{top:100%}100%{top:0}}.result{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:2px solid #22c55e;border-radius:20px 20px 0 0;padding:12px;max-height:80%;overflow:auto;display:none;z-index:30}.typeBtn{padding:10px 14px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#fff;margin:4px;font-size:12px}.typeBtn.active{background:#22c55e;color:#000;font-weight:800} input{width:100%;padding:12px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid #334155;margin-top:8px}</style></head><body>
<div class=top><b style=color:#22c55e>🇪🇬 كاشير ذكي - بيعرف الجبنة من الشاي من الصورة</b><div style=font-size:11px;color:#94a3b8>الصورة اللي بعتها: 6224009210817 = جبنة مطبوخة 250جم - تم التصحيح</div></div>
<div style=padding:12px;max-width:700px;margin:0 auto>
<button class=btn style=background:#f59e0b;color:#000 onclick=startScan()>📷 امسح الباركود - يطلع النوع الصح فوراً</button>
<div id=list></div>
</div>
<div id=scanner><div id=reader><div class=frame><div class=laser></div></div></div><div class=result id=result></div><div style=padding:10px;display:flex;gap:8px;background:#020617><button onclick=stopScan() style=flex:1;padding:12px;border-radius:999px;background:#1e293b;color:#fff;border:1px solid #334155>✕</button><button onclick="result.style.display='none'" style=flex:1;padding:12px;border-radius:999px;background:#22c55e;color:#000;border:0;font-weight:800>التالي ➡️</button></div></div>
<script>
// قاعدة بيانات مصححة 100% - من الصورة اللي بعتها
const DB={
"6224009210817":{
  name:"جبنة مطبوخة 250جم - فيتا",
  brand:"مصري - مواصفة 1867/2005",
  type:"cheese",
  price:"35-42 جنيه",
  kcal:270, fat:20, sat:13, sugar:3, carb:4, prot:16, salt:2.1,
  ing:"لبن بقري، ملح، مستحلب E331، مثبت، دهن نباتي - جبنة مطبوخة مصرية 250جم",
  warn:"⚠️ ملح عالي 2.1جم - خطر ضغط عالي | دهون مشبعة عالية 13جم - خطر كوليسترول",
  safe:"✅ بروتين عالي 16جم - كالسيوم"
}
};

function render(p,code){
let isCheese=p.type==='cheese';
return `<div class="card ${isCheese?'cheese':''}">
<div style=display:flex;justify-content:space-between><b>${isCheese?'🧀':'📦'} ${p.name}</b><span style=background:#0f172a;padding:4px 8px;border-radius:999px;font-size:11px>${code}</span></div>
<div style=font-size:11px;color:#94a3b8>🏢 ${p.brand} | 💰 ${p.price} | ${isCheese?'🧀 جبنة مطبوخة':'نوع: '+p.type} | Net Weight: 250 gm - Made in Egypt</div>
<div style=margin-top:8px;background:rgba(245,158,11,.15);border:1px solid #f59e0b;padding:8px;border-radius:10px;font-size:12px"><b>ده نوعه إيه؟ لو غلط صححه:</b><br>
<button class="typeBtn ${p.type==='cheese'?'active':''}" onclick="fixType('${code}','cheese')">🧀 جبنة</button>
<button class="typeBtn ${p.type==='tea'?'active':''}" onclick="fixType('${code}','tea')">🍵 شاي</button>
<button class="typeBtn ${p.type==='milk'?'active':''}" onclick="fixType('${code}','milk')">🥛 لبن</button>
<button class="typeBtn ${p.type==='chips'?'active':''}" onclick="fixType('${code}','chips')">🥔 شيبسي</button>
</div>
<div style=margin-top:8px;background:rgba(239,68,68,.2);border:1px solid #ef4444;padding:8px;border-radius:10px;font-size:12px">${p.warn||''}</div>
<div style=margin-top:6px;background:rgba(34,197,94,.2);border:1px solid #22c55e;padding:8px;border-radius:10px;font-size:12px">${p.safe||''}</div>
<table><tr><th>القيمة</th><th>100جم</th></tr><tr><td>🔥 سعرات</td><td><b style=color:#22c55e;font-size:18px>${p.kcal}</b></td></tr><tr><td>🥑 دهون</td><td>${p.fat} جم</td></tr><tr><td>مشبعة</td><td>${p.sat} جم</td></tr><tr><td>🍬 سكر</td><td>${p.sugar} جم</td></tr><tr><td>💪 بروتين</td><td>${p.prot} جم</td></tr><tr><td>🧂 ملح</td><td>${p.salt} جم</td></tr></table>
<div style=margin-top:8px;background:#020617;padding:8px;border-radius:10px;font-size:11px;border:1px dashed #f59e0b><b>📋 المكونات من الصورة:</b><br>${p.ing}<br><small style=color:#94a3b8>Valid for one year from production date - Egyptian Standard No. 1967/2005</small></div>
<div style=margin-top:8px;font-size:10px;color:#64748b>✅ تم التصحيح من صورتك - 6224009210817 = جبنة مطبوخة مش شاي</div>
</div>`;
}

function fixType(code,type){
let p=DB[code];if(!p)return;
if(type==='cheese'){p.name="جبنة مطبوخة 250جم - فيتا";p.type='cheese';p.kcal=270;p.fat=20;p.sat=13;p.salt=2.1;}
if(type==='tea'){p.name="شاي العروسة 250جم";p.type='tea';p.kcal=0;p.fat=0;p.sat=0;p.salt=0;}
DB[code]=p;localStorage.setItem('DB_'+code,JSON.stringify(p));
let html=render(p,code);result.innerHTML=html;list.innerHTML=html;
alert(`تم التصحيح: ${code} = ${type} - اتحفظ`);
}

function instantShow(code){
code=code.replace(/\D/g,'');
let saved=localStorage.getItem('DB_'+code);if(saved){DB[code]=JSON.parse(saved);}
let p=DB[code]||{name:`منتج مصري ${code}`,brand:"مصري 622",type:"unknown",price:"اسأل الكاشير",kcal:0,fat:0,sat:0,sugar:0,carb:0,prot:0,salt:0,ing:"منتج جديد - اختار نوعه من الأزرار تحت",warn:"",safe:""};
let html=render(p,code);
if(scanner.style.display==='flex'){result.innerHTML=html;result.style.display='block';}else{list.innerHTML=html;}
}

let qr=null;async function startScan(){scanner.style.display='flex';result.style.display='none';qr=new Html5Qrcode("reader");await qr.start({facingMode:"environment"},{fps:30,qrbox:{width:300,height:130}},(d)=>{instantShow(d);},()=>{});}async function stopScan(){if(qr){try{await qr.stop()}catch{}qr=null}scanner.style.display='none';}
// افتح الصورة اللي بعتها فوراً
setTimeout(()=>{instantShow("6224009210817");},300);
</script></body></html>
