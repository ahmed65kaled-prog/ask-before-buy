<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قبل ما تشتري... اسال.</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#eef2f7;font-family:system-ui;padding:10px}
.card{max-width:520px;margin:10px auto;background:#fff;border-radius:20px;padding:16px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:#0f172a;color:#fff;font-weight:900;margin:8px 0}
input{width:100%;padding:13px;border-radius:12px;border:2px solid #e2e8f0;text-align:center;box-sizing:border-box}
.dark{background:#0f172a;border-radius:16px;padding:14px;color:#fff;margin-top:12px}
.barcode{color:#ff4d9d;font-weight:900;font-size:19px;direction:ltr;text-align:right}
.line{padding:11px 0;border-bottom:1px solid #1e293b;font-size:17px}
#reader{display:none;border-radius:14px;overflow:hidden}
.top{font-size:12px;color:#16a34a;text-align:center;background:#dcfce7;padding:7px;border-radius:10px}
.store{display:flex;justify-content:space-between;background:#1e293b;padding:10px;border-radius:10px;margin:6px 0;text-decoration:none;color:#fff}
.store b{color:#22c55e}
</style></head><body>
<div class="card">
<div class="top">🟢 متصل - وضع المنتجات العالمية 🌍</div>
<h1 style="text-align:center;margin:8px 0">قبل ما تشتري... اسال.</h1>
<button class="btn" onclick="startScan()">📷 مسح باركود (أكل أو موبايل)</button>
<div id="reader"></div>
<input id="q" value="4890000000000" placeholder="باركود الانفينكس">
<button class="btn" style="background:#16a34a" onclick="show()">بحث عن السعر في مصر</button>
<div id="out"></div>
<div id="loc" style="font-size:12px;color:#16a34a;text-align:center;margin-top:8px"></div>
</div>
<script>
let qr, lat=30.03, lon=31.21;
const WORLD_DB={
"6224009210824":{name:"جبنة رومي مصرية", type:"food", prices:[{s:"كارفور",p:"18.5ج",d:"1.2 كم"},{s:"أمازون مصر",p:"22ج"},{s:"جوميا",p:"19ج"}]},
"4890000000000":{name:"Infinix - موبايل عالمي 489", type:"mobile", prices:[{s:"أمازون مصر",p:"6,499ج"},{s:"جوميا مصر",p:"6,350ج"},{s:"نون مصر",p:"6,400ج"},{s:"بي.تك",p:"6,599ج"},{s:"دريم 2000",p:"6,300ج"}]},
"4891234567890":{name:"Infinix Hot 40 Pro", type:"mobile", prices:[{s:"أمازون مصر",p:"7,200ج"},{s:"جوميا",p:"6,999ج"},{s:"نون",p:"7,100ج"}]}
};
function detectType(code){
if(code.startsWith("622")) return "food";
if(code.startsWith("489") || code.startsWith("690") || code.startsWith("471")) return "mobile";
return "food";
}
function show(){
let code=document.getElementById('q').value.trim()||"4890000000000";
let p=WORLD_DB[code];
if(!p){
let t=detectType(code);
if(t==="mobile"){
p={name:`موبايل عالمي ${code.slice(0,3)} - Infinix أو شبيه`, type:"mobile", prices:[
{s:"أمازون مصر",p:"شوف السعر", link:`https://www.amazon.eg/s?k=infinix+${code}`},
{s:"جوميا مصر",p:"شوف السعر", link:`https://www.jumia.com.eg/catalog/?q=infinix+${code}`},
{s:"نون مصر",p:"شوف السعر", link:`https://www.noon.com/egypt/search?q=infinix+${code}`},
{s:"بي.تك",p:"شوف السعر", link:`https://btech.com/search?q=infinix`},
{s:"دريم 2000",p:"شوف السعر", link:`https://dream2000.com/?s=infinix`}
]};
}else{
p={name:`منتج غذائي ${code}`, type:"food", prices:[
{s:"كارفور مصر",p:"18.5ج",d:"1.2 كم", link:`https://www.carrefouregypt.com/search?q=${code}`},
{s:"أمازون مصر",p:"22ج", link:`https://www.amazon.eg/s?k=${code}`},
{s:"جوميا",p:"19ج", link:`https://www.jumia.com.eg/catalog/?q=${code}`}
]};
}
}
let html=`<div class="dark">
<div class="barcode">${code} <span style="color:#fff"> ${p.name}</span></div>
<div style="color:#4ade80;font-size:12px;margin:6px 0">✔ ${code.startsWith("622")?"مصري 622 🇪🇬":code.startsWith("489")?"عالمي 489 🌍 (الصين - هونج كونج) - متوفر في مصر":"مستورد"} - ${p.type==="mobile"?"موبايلات وأجهزة":"أكل وشرب"}</div>
<hr style="border-color:#1e293b">`;
p.prices.forEach(pr=>{
let link=pr.link||`https://www.google.com/search?q=${encodeURIComponent(p.name)}+سعر+مصر`;
html+=`<a class="store" href="${link}" target="_blank"><span>${pr.s} ${pr.d?"("+pr.d+")":""}</span><b>${pr.p} ↗</b></a>`;
});
html+=`<div style="font-size:11px;color:#64748b;margin-top:8px">الأسعار من المتاجر المصرية - اضغط يوديك للسعر الحي. عشان نجيب الرقم أوتوماتيك محتاجين Worker هعملهولك.</div></div>`;
document.getElementById('out').innerHTML=html;
}
function startScan(){
document.getElementById('reader').style.display='block';
if(!qr) qr=new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:270},d=>{document.getElementById('q').value=d;qr.stop();document.getElementById('reader').style.display='none';show();},()=>{});
}
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;document.getElementById('loc').innerText=`📍 موقعك: ${lat.toFixed(3)},${lon.toFixed(3)} - كفرة نصار`;});}
show();
</script></body></html>
