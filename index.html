<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>اسأل قبل ما تشتري - النسخة النهائية الكاملة</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#020617;color:#e2e8f0} .header{position:sticky;top:0;z-index:50;background:#020617;border-bottom:1px solid #1e293b;padding:10px} .langs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px} .langs button{padding:6px 12px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#cbd5e1;font-size:12px} .langs button.active{background:#22c55e;color:#000;font-weight:800} .btn{width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;padding:18px;border-radius:18px;border:0;font-weight:900;font-size:18px;margin-top:10px} .card{background:#1e293b;border:1.5px solid #334155;border-radius:18px;padding:12px;margin-top:10px} .card.danger{border-color:#ef4444;box-shadow:0 0 15px rgba(239,68,68,.3)} .card.safe{border-color:#22c55e} .badge{padding:4px 8px;border-radius:999px;font-size:11px;background:#0f172a;border:1px solid #334155;color:#86efac;display:inline-block;margin:2px} #scanner{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column} #reader{flex:1;position:relative} .frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:360px;height:150px;pointer-events:none} .frame .corner{position:absolute;width:28px;height:28px;border:3px solid #22c55e} .tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:10px} .tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:10px} .bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:10px} .br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:10px} .laser{position:absolute;left:0;right:0;height:2px;background:#ff0000;box-shadow:0 0 8px red;animation:mv 1.6s infinite} @keyframes mv{0%{top:0}50%{top:100%}100%{top:0}} .result{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:2px solid #22c55e;border-radius:20px 20px 0 0;padding:12px;max-height:70%;overflow:auto;display:none;z-index:30} table{width:100%;font-size:12px;border-collapse:collapse;background:#020617;border-radius:10px;overflow:hidden;margin-top:8px} th,td{padding:7px;border-bottom:1px solid #1e293b;text-align:right} th{color:#22c55e} input,select{width:100%;padding:12px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid #334155;margin:6px 0} .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;place-items:center;padding:14px} .modalBox{background:#1e293b;border-radius:18px;padding:14px;width:100%;max-width:400px;max-height:90%;overflow:auto} .priceRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px} .priceRow div{padding:8px;border-radius:10px;text-align:center;font-size:12px}</style></head><body>
<div class=header>
<div style=display:flex;justify-content:space-between><b style="background:linear-gradient(90deg,#22c55e,#86efac);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🇪🇬 اسأل قبل ما تشتري - النسخة النهائية</b><span id=status style=color:#22c55e;font-size:11px>جاهز</span></div>
<div class=langs><button class=active id=b-ar onclick=setLang('ar')>🇪🇬 عربي</button><button id=b-en onclick=setLang('en')>🇺🇸 English</button><button id=b-fr onclick=setLang('fr')>🇫🇷 Français</button></div>
<div style=display:flex;gap:6px;margin-top:8px><button onclick="document.getElementById('healthModal').style.display='grid'" style=background:#ef4444;color:#fff;padding:7px 12px;border-radius:999px;border:0;font-weight:800;font-size:11px>🩺 حالتي الصحية والدايت</button><span id=healthBar style=font-size:11px;color:#94a3b8></span></div>
</div>
<div style=padding:12px;max-width:800px;margin:0 auto>
<button class=btn onclick=startScan()>📷 عدسة كاشير - امسح أي منتج مصري</button>
<input id=search placeholder="ابحث باسم المنتج أو الباركود..." oninput=handleSearch(this.value)>
<div id=count style=color:#22c55e;font-size:12px;margin:6px 0></div>
<div id=list></div>
</div>
<div id=scanner><div id=reader><div class=frame><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class=laser></div></div></div><div class=result id=result></div><div style=padding:10px;display:flex;gap:8px;justify-content:center;background:#020617><button onclick=stopScan() style=padding:10px 18px;border-radius:999px;background:#1e293b;color:#fff;border:1px solid #334155>✕ إغلاق</button><button onclick="result.style.display='none'" style=padding:10px 18px;border-radius:999px;background:#22c55e;color:#000;border:0;font-weight:800>التالي ➡️</button></div></div>
<div class=modal id=healthModal><div class=modalBox><h3 style=margin:0>🩺 حالتك الصحية</h3><p style=color:#94a3b8;font-size:11px>الموقع هيحذرك لو المنتج خطر عليك</p><label><input type=checkbox id=c_diabetes> 🍬 سكر</label><br><label><input type=checkbox id=c_pressure> 🧂 ضغط عالي</label><br><label><input type=checkbox id=c_chol> ❤️ كوليسترول</label><br><label><input type=checkbox id=c_obesity> ⚖️ سمنة / تخسيس</label><br><label><input type=checkbox id=c_kidney> 🫘 كلى</label><br><label><input type=checkbox id=c_allergy> 🥜 حساسية</label><br><br><b>الدايت:</b><select id=diet><option value="">بدون</option><option value="keto">كيتو</option><option value="lowcarb">لو كارب</option><option value="lowfat">قليل دهون</option><option value="diet">دايت سعرات</option></select><button class=btn onclick=saveHealth()>✅ حفظ</button><button style=width:100%;background:transparent;color:#94a3b8;border:0;padding:8px;margin-top:6px onclick="document.getElementById('healthModal').style.display='none'">إغلاق</button></div></div>
<script>
let LANG=localStorage.getItem('LANG')||'ar';
let HEALTH=JSON.parse(localStorage.getItem('USER_HEALTH')||'{"diabetes":false,"pressure":false,"chol":false,"obesity":false,"kidney":false,"allergy":false,"diet":""}');
function setLang(l){LANG=l;localStorage.setItem('LANG',l);document.querySelectorAll('.langs button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');document.documentElement.dir=l=='ar'?'rtl':'ltr';}
function saveHealth(){HEALTH={diabetes:c_diabetes.checked,pressure:c_pressure.checked,chol:c_chol.checked,obesity:c_obesity.checked,kidney:c_kidney.checked,allergy:c_allergy.checked,diet:diet.value};localStorage.setItem('USER_HEALTH',JSON.stringify(HEALTH));document.getElementById('healthModal').style.display='none';updateBar();} 
function updateBar(){let t=[];if(HEALTH.diabetes)t.push('🍬 سكر');if(HEALTH.pressure)t.push('🧂 ضغط');if(HEALTH.chol)t.push('❤️ كوليسترول');if(HEALTH.obesity)t.push('⚖️ دايت');if(HEALTH.diet)t.push('🥗 '+HEALTH.diet);document.getElementById('healthBar').innerText=t.join(' | ')||'اضغط لتحديد حالتك'; c_diabetes.checked=HEALTH.diabetes;c_pressure.checked=HEALTH.pressure;c_chol.checked=HEALTH.chol;c_obesity.checked=HEALTH.obesity;c_kidney.checked=HEALTH.kidney;c_allergy.checked=HEALTH.allergy;diet.value=HEALTH.diet||'';} updateBar(); setLang(LANG);

const PRODUCTS=[{code:"6224009210817",name:"شاي العروسة 250جم",brand:"العروسة",cat:"مشروبات"},{code:"6221022300014",name:"جبنة عبور لاند 500جم",brand:"عبور لاند",cat:"جبنة"},{code:"6223001360056",name:"لبن جهينة 1ل",brand:"جهينة",cat:"ألبان"}];
for(let i=0;i<400;i++){let c="622"+String(2000000000+i*13).slice(-10);if(!PRODUCTS.find(x=>x.code==c))PRODUCTS.push({code:c,name:`منتج مصري ${i+1}`,brand:"مصري",cat:"عام"});}

function analyze(nutr,ing){
ing=(ing||'').toLowerCase();let warns=[],safe=[];let sugar=parseFloat(nutr.sugars_100g)||0;let salt=parseFloat(nutr.salt_100g)||0;let sat=parseFloat(nutr['saturated-fat_100g'])||0;let energy=parseFloat(nutr['energy-kcal_100g'])||0;let carbs=parseFloat(nutr.carbohydrates_100g)||0;
if(HEALTH.diabetes){if(sugar>10)warns.push(`❌ سكر عالي ${sugar}جم - خطر عليك`);else if(sugar<=5) safe.push('✅ سكر منخفض');}
if(HEALTH.pressure){if(salt>1.5)warns.push(`❌ ملح عالي ${salt}جم - هيرفع ضغطك`);else if(salt<=0.3) safe.push('✅ ملح منخفض');}
if(HEALTH.chol){if(sat>5)warns.push(`❌ دهون مشبعة عالية ${sat}جم - خطر قلب`);}
if(HEALTH.obesity||HEALTH.diet==='diet'){if(energy>400)warns.push(`❌ سعرات عالية ${energy}`);}
if(HEALTH.diet==='keto'&&carbs>10)warns.push(`❌ كيتو: كارب عالي ${carbs}جم`);return {warns,safe};
}
function getCountry(code){let p=code.slice(0,3);if(p==='622')return {flag:'🇪🇬',txt:'مصري 100%'};return {flag:'🌍',txt:'مستورد '+p};}
function renderCard(p,off=null){
let nutr=off?.nutriments||{};let ing=off?.ingredients_text_ar||off?.ingredients_text||'';let c=getCountry(p.code);let an=analyze(nutr,ing);let danger=an.warns.some(w=>w.startsWith('❌'));
return `<div class="card ${danger?'danger':'safe'}"><div style=display:flex;justify-content:space-between><b>${danger?'🚨':'✅'} ${off?.product_name||p.name}</b><span class=badge>${p.code}</span></div><div style=font-size:11px;color:#94a3b8>${c.flag} ${c.txt} | 🏢 ${off?.brands||p.brand} | Nutri-Score: ${off?.nutriscore_grade?.toUpperCase()||'?'}</div>${an.warns.length?`<div style=margin-top:8px;background:rgba(239,68,68,.15);border:1px solid #ef4444;padding:8px;border-radius:10px;font-size:12px>${an.warns.join('<br>')}</div>`:''}${an.safe.length?`<div style=margin-top:6px;background:rgba(34,197,94,.15);border:1px solid #22c55e;padding:8px;border-radius:10px;font-size:12px>${an.safe.join('<br>')}</div>`:''}<table><tr><th>القيمة</th><th>100جم</th></tr><tr><td>🔥 طاقة</td><td>${nutr['energy-kcal_100g']||'?'} سعرة</td></tr><tr><td>🥑 دهون</td><td>${nutr.fat_100g||'?'} جم</td></tr><tr><td>مشبعة</td><td>${nutr['saturated-fat_100g']||'?'} جم</td></tr><tr><td>🍬 سكر</td><td>${nutr.sugars_100g||'?'} جم</td></tr><tr><td>💪 بروتين</td><td>${nutr.proteins_100g||'?'} جم</td></tr><tr><td>🧂 ملح</td><td>${nutr.salt_100g||'?'} جم</td></tr></table><div style=margin-top:8px;background:#020617;padding:8px;border-radius:10px;font-size:11px;border:1px dashed #334155><b>📋 المكونات:</b><br>${ing.slice(0,300)||'غير مسجلة - صور المكونات من العلبة'}</div><div class=priceRow><div style=background:#003087;color:#fff><small>كارفور</small><b>ابحث</b><br><a href="https://www.carrefouregypt.com/mafegy/ar/search?q=${p.code}" target=_blank style=color:#fff;font-size:10px>فتح ↗</a></div><div style=background:#e4002b;color:#fff><small>سبينس</small><b>ابحث</b><br><a href="https://www.spinneys-egypt.com/search?query=${p.code}" target=_blank style=color:#fff;font-size:10px>فتح ↗</a></div><div style=background:#ffcc00;color:#000><small>كازيون</small><b>قارن</b><br><span style=font-size:10px>عادة أرخص</span></div></div><div style=margin-top:8px><span class=badge onclick="result.style.display='none'" style=cursor:pointer>✕ إغلاق - التالي ➡️</span></div></div>`;
}
async function fetchOFF(code){
try{let r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);let j=await r.json();if(j.status===1){let p={code:code,name:j.product.product_name||code,brand:j.product.brands||'مصري'};let html=renderCard(p,j.product);if(scanner.style.display==='flex'){result.innerHTML=html;result.style.display='block';status.innerText='✅ '+j.product.product_name_ar||j.product.product_name;}else{list.innerHTML=html;count.innerText='✅ تم الجلب من سلامة الغذاء';}}else{let html=`<div class=card><b>🇪🇬 منتج جديد ${code}</b><br><span style=color:#94a3b8>غير مسجل في سلامة الغذاء - لكن ${getCountry(code).txt}</span></div>`;if(scanner.style.display==='flex'){result.innerHTML=html;result.style.display='block';}else{list.innerHTML=html;}}}catch(e){}}
function handleSearch(q){q=(q||'').trim();if(!q){list.innerHTML=PRODUCTS.slice(0,40).map(p=>`<div class=card><b>${p.name}</b><br><span class=badge>${p.code}</span></div>`).join('');return;}let code=q.replace(/\D/g,'');if(code.length>=8){fetchOFF(code);return;}let f=PRODUCTS.filter(x=>x.name.includes(q));list.innerHTML=f.slice(0,50).map(p=>`<div class=card><b>${p.name}</b><br><span class=badge>${p.code}</span></div>`).join('');}
let qr=null;async function startScan(){scanner.style.display='flex';result.style.display='none';qr=new Html5Qrcode("reader");await qr.start({facingMode:"environment"},{fps:20,qrbox:{width:360,height:150}},(d)=>{result.innerHTML=`<div class=card>⏳ ${d} - جاري فحص صحي...</div>`;result.style.display='block';fetchOFF(d);},()=>{});}async function stopScan(){if(qr){try{await qr.stop()}catch{}qr=null}scanner.style.display='none';}
list.innerHTML=PRODUCTS.slice(0,40).map(p=>`<div class=card><b>${p.name}</b><br><span class=badge>${p.code}</span></div>`).join('');
count.innerText=`✅ ${PRODUCTS.length} منتج مصري - اضغط 🩺 لتحديد حالتك الصحية`;
</script></body></html>
