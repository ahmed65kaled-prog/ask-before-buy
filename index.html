<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>اسأل 622</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{background:#020617;color:#fff;font-family:system-ui;padding:14px;margin:0}h1{text-align:center;color:#22c55e}.btn{width:100%;background:#22c55e;color:#000;padding:18px;border-radius:20px;border:0;font-weight:900;font-size:19px}.card{background:#1e293b;border:2px solid #22c55e;border-radius:20px;padding:18px;margin-top:14px}.badge{display:inline-block;padding:6px 12px;border-radius:99px;font-weight:800;margin:2px}.kv{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}.kv div{background:#020617;padding:10px;border-radius:12px;text-align:center;border:1px solid #334155}#scanner{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}#reader{flex:1}input{width:100%;padding:16px;border-radius:14px;background:#0f172a;color:#fff;border:1px solid #334155;margin:12px 0}</style></head><body>
<h1>🌍 اسأل قبل ما تشتري - 100%</h1>
<button class=btn onclick=startScan()>📷 امسح أي باركود</button>
<div id=scanner><div id=reader></div><div style=text-align:center;padding:16px><button onclick=stopScan() style=padding:10px 20px;border-radius:99px>✕ إغلاق</button></div></div>
<input id=search placeholder="اكتب الباركود 622..." oninput=show(this.value)>
<div id=count style=color:#22c55e;font-weight:800></div>
<div id=list></div>
<script>
function getC(c){c=c.replace(/\D/g,'');let p=c.slice(0,3);if(p=='622')return{flag:'🇪🇬',name:'مصر - منتج مصري 100%',col:'#22c55e',eg:true};if(p=='729')return{flag:'🚫',name:'مقاطعة',col:'#ef4444',eg:false};return{flag:'🌍',name:'مستورد '+p,col:'#f59e0b',eg:false};}
function show(code){
code=(code||'').replace(/\D/g,'');if(code.length<8){list.innerHTML='<div class=card>اكتب 8 أرقام</div>';return;}
let i=getC(code);
let known={"6224009210817":{n:"شاي العروسة 250جم",b:"العروسة",p:"35 جنيه",k:2,f:0,r:0,d:"شاي أسود فاخر - مصري 100%"},"6223001360056":{n:"لبن جهينة 1 لتر",b:"جهينة",p:"32 جنيه",k:61,f:3.2,r:3,d:"كالسيوم عالي"}};
let pr=known[code]||{n:"منتج رقم "+code,b:"علامة باركود "+code.slice(0,7),p:"اسأل البائع",k:"?",f:"?",r:"?",d:i.eg?"✅ باركود مصري أصلي 622 - مسجل في مصر - ادعم منتج بلدك":"⚠️ "+i.name};
list.innerHTML=`<div class=card style=border-color:${i.col}><span class=badge style=background:${i.col};color:${i.eg?'#000':'#fff'}>${i.flag} ${i.name}</span> <span class=badge style=background:#0f172a;border:1px solid #334155>${code}</span><h2>${pr.n}</h2><p>🏢 العلامة: <b>${pr.b}</b> | 💰 ${pr.p}</p><div class=kv><div><b>🔥 ${pr.k}</b><br><small>سعرة</small></div><div><b>🥑 ${pr.f}g</b><small>دهون</small></div><div><b>💪 ${pr.r}g</b><small>بروتين</small></div><div style=background:${i.col};color:${i.eg?'#000':'#fff'}><b>${i.flag}</b><br>${i.eg?'مصري':'مستورد'}</div></div><div style=margin-top:12px;background:#020617;padding:12px;border-radius:12px;border:1px dashed ${i.col}>💡 <b>التقرير:</b><br>${pr.d}<br><br>📌 كود الدولة: ${code.slice(0,3)}<br>📌 كود الشركة: ${code.slice(3,7)}<br>📌 كود المنتج: ${code.slice(7)}</div></div>`;
count.innerText="✅ تقرير فوري: "+code+" - "+i.flag+" "+i.name;
}
let qr=null;async function startScan(){scanner.style.display='flex';qr=new Html5Qrcode("reader");await qr.start({facingMode:"environment"},{fps:15,qrbox:{width:300,height:120}},(d)=>{stopScan();search.value=d;show(d);},()=>{});}async function stopScan(){if(qr){try{await qr.stop()}catch{}qr=null}scanner.style.display='none';}
show('6224009210817');
</script></body></html>
