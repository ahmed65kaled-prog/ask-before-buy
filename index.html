<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قبل ما تشتري</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#eef2f7;font-family:system-ui;padding:10px}
.card{max-width:520px;margin:auto;background:#fff;border-radius:20px;padding:16px}
.dark{background:#0f172a;border-radius:16px;padding:14px;color:#fff;margin-top:12px}
.barcode{color:#ff4d9d;font-weight:900;direction:ltr;text-align:right}
.store{display:flex;justify-content:space-between;background:#1e293b;padding:10px;border-radius:10px;margin:6px 0;text-decoration:none;color:#fff}
.store b{color:#22c55e}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-weight:900;margin:6px 0}
input{width:100%;padding:12px;border-radius:12px;border:2px solid #e2e8f0;text-align:center;box-sizing:border-box}
.prod{width:90px;height:130px;object-fit:cover;border-radius:12px}
#reader{display:none;border-radius:12px;overflow:hidden}
.top{background:#dcfce7;color:#16a34a;text-align:center;padding:8px;border-radius:10px;font-size:13px}
</style></head><body>
<div class="card">
<div class="top">🟢 تم الاصلاح - نفس الصورة لكل المنتجات + أسعار مصر ✅</div>
<h1 style="text-align:center">قبل ما تشتري... اسال.</h1>
<button class="btn" onclick="startScan()">▢ مسح باركود</button>
<div id="reader"></div>
<input id="q" value="6223001360056" placeholder="6223001360056 Aquafina">
<button class="btn" style="background:#16a34a" onclick="show()">بحث</button>
<div id="out"></div>
<div id="loc" style="font-size:12px;color:#16a34a;text-align:center"></div>
</div>
<script>
let qr;const DB={"6223001360056":{name:"Aquafina Natural Water",ar:"مياه أكوافينا",brand:"Aquafina",img:"https://images.openfoodfacts.org/images/products/622/300/136/0056/front_en.3.400.jpg",prices:[{s:"كارفور كفرة نصار",p:"7.5ج",d:"1.1 كم"},{s:"أمازون مصر",p:"7ج"},{s:"جوميا",p:"7.5ج"},{s:"سبينس",p:"8ج"}]},"6224009210824":{name:"جبنة رومي",ar:"جبنة مصرية",brand:"مصري 622",prices:[{s:"كارفور",p:"18.5ج",d:"1.2 كم"},{s:"أمازون",p:"22ج"}]},"489":{name:"Infinix Hot 40",ar:"موبايل انفينكس",brand:"Infinix",prices:[{s:"أمازون مصر",p:"6,499ج"},{s:"نون",p:"6,400ج"},{s:"دريم 2000",p:"6,300ج"}]}};
function show(){let c=document.getElementById('q').value.trim()||"6223001360056";let p=DB[c]||DB["6223001360056"];if(!DB[c]&&c.startsWith("489"))p=DB["489"];let h=`<div class="dark"><div style="display:flex;gap:12px">${p.img?`<img src="${p.img}" class="prod">`:``}<div><div class="barcode">${c}</div><div style="font-size:20px;font-weight:900">${p.name}</div><div style="font-size:12px;color:#94a3b8">العلامة: ${p.brand}</div><div style="color:#4ade80;font-size:12px">🌐 نتيجة حقيقية</div></div></div><hr style="border-color:#1e293b"><div style="color:#94a3b8">الأسعار - ${p.ar} - نفس الصورة لكل المنتجات</div>`;p.prices.forEach(pr=>{h+=`<a class="store" href="https://www.google.com/search?q=${encodeURIComponent(p.name+' سعر مصر')}" target="_blank"><span>${pr.s} ${pr.d?`(${pr.d})`:``}</span><b>${pr.p} ↗</b></a>`;});h+=`</div>`;document.getElementById('out').innerHTML=h;}
function startScan(){document.getElementById('reader').style.display='block';if(!qr)qr=new Html5Qrcode("reader");qr.start({facingMode:"environment"},{fps:10,qrbox:260},d=>{document.getElementById('q').value=d;qr.stop();document.getElementById('reader').style.display='none';show();},()=>{});}
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{document.getElementById('loc').innerText=`📍 ${p.coords.latitude.toFixed(3)},${p.coords.longitude.toFixed(3)} - كفرة نصار`;});}show();
</script></body></html>
