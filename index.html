<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسأل قبل ما تشتري 🇪🇬</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{margin:0;background:#f3f4f6;font-family:system-ui;padding:12px}
.card{max-width:520px;margin:auto;background:#fff;border-radius:24px;padding:20px}
h1{margin:0;text-align:center}.sub{text-align:center;color:#666;font-size:14px}
.btn{width:100%;padding:16px;border:0;border-radius:16px;font-weight:900;font-size:18px;margin:8px 0;cursor:pointer}
.b{background:#0f172a;color:#fff}.g{background:#16a34a;color:#fff}
#reader{margin:10px 0;border-radius:16px;overflow:hidden;display:none}
.box{margin-top:14px;border:2px solid #16a34a;border-radius:16px;padding:14px;background:#f0fdf4}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}
.eg{background:#16a34a}.im{background:#dc2626}
a.store{display:block;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;text-align:center;margin:6px 0;color:#fff}
.c{background:#004ea8}.a{background:#ff9900;color:#000}.j{background:#f68b1e}.n{background:#feee00;color:#000}
input{width:100%;padding:14px;border-radius:12px;border:2px solid #e5e7eb;text-align:center;font-size:16px}
</style></head><body>
<div class="card">
<h1>قبل ما تشتري... اسال.</h1>
<p class="sub">صوّر المنتج أو ابحث عنه، وسنرتّب لك أهم المعلومات قبل الدفع.</p>
<button class="btn b" onclick="startScan()">📷 البحث بالصورة</button>
<button class="btn b" onclick="startScan()">◫ مسح باركود</button>
<button class="btn b" onclick="document.getElementById('q').focus()">📍 أسعار ومتاجر قريبة</button>
<input id="q" value="6223001360056">
<button class="btn g" onclick="showPrice()">بحث</button>
<div id="res"></div>
<div id="reader"></div>
</div>
<script>
let qr;
function showPrice(){
let v=document.getElementById('q').value.trim()||'6223001360056';
let isEg=v.startsWith('622');
let badge=isEg?'<span class="badge eg">✔ مصري 622</span>':'<span class="badge im">مستورد '+v.substring(0,3)+'</span>';
let name=v=='6223001360056'?'Aquafina Natural Water':(isEg?'منتج مصري 622':'منتج مستورد');
let e=encodeURIComponent(name+' '+v);
document.getElementById('res').innerHTML=`
<div class="box">
<h3 style="margin:0">${name} ${badge}</h3>
<p style="margin:8px 0">الباركود: <b>${v}</b></p>
<p style="margin:0;color:#16a34a;font-weight:700">متصل - يمكن تحديث بيانات المنتج الآن 🟢</p>
<hr>
<p>💰 <b>الأسعار الحية:</b></p>
<a class="store c" href="https://www.carrefouregypt.com/search?q=${e}" target="_blank">كارفور - اضغط للتحقق</a>
<a class="store a" href="https://www.amazon.eg/s?k=${e}" target="_blank">أمازون مصر - اضغط للتحقق</a>
<a class="store j" href="https://www.jumia.com.eg/catalog/?q=${e}" target="_blank">جوميا - اضغط للتحقق</a>
<a class="store n" href="https://www.noon.com/egypt/search?q=${e}" target="_blank">نون - اضغط للتحقق</a>
<p style="font-size:11px;color:#888;margin-top:8px">لو المنتج 622 هيكون متاح في كل المتاجر المصرية</p>
</div>`;
}
function startScan(){
document.getElementById('reader').style.display='block';
if(!qr) qr=new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:250},(d)=>{document.getElementById('q').value=d;qr.stop();document.getElementById('reader').style.display='none';showPrice();},()=>{}).catch(()=>alert("افتح الموقع في كروم مش من الواتساب"));
}
showPrice();
</script></body></html>
