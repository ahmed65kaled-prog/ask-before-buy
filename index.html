<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسأل قبل ما تشتري</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#0b1220;font-family:system-ui;padding:12px}
.card{max-width:480px;margin:20px auto;background:#141d32;border:1px solid #243049;border-radius:16px;overflow:hidden}
.header{padding:12px 14px;display:flex;justify-content:space-between;border-bottom:1px solid #243049;color:#94a3b8;font-size:12px}
.header b{color:#22c55e}
.content{padding:14px}
.barcode{color:#f472b6;font-size:20px;font-weight:900;direction:ltr;text-align:right}
.barcode span{color:#fff;font-weight:400;font-size:18px;margin-right:8px}
.line{padding:12px 0;border-bottom:1px solid #1e293b;font-size:18px;display:flex;justify-content:space-between}
.line b{color:#fff}.pink{color:#f472b6!important}
.small{font-size:13px;color:#64748b;margin-top:10px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:900;margin:6px 0;cursor:pointer}
.white{background:#e2e8f0;color:#0f172a}.green{background:#22c55e;color:#000}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #243049;background:#0b1220;color:#fff;text-align:center;margin:6px 0;box-sizing:border-box}
#reader{display:none;margin:10px 0;border-radius:12px;overflow:hidden}
a{color:#22c55e;text-decoration:none}
</style></head><body>
<div class="card">
<div class="header"><div>لو ضغطتها، موضحتك هيعمل.</div><div style="text-align:left">رمز<br><b><> عرض الرمز</b></div></div>
<div class="content">
<button class="btn white" onclick="startScan()">📷 صوّر أي باركود</button>
<div id="reader"></div>
<input id="q" value="6224009210824" placeholder="اكتب الباركود">
<button class="btn green" onclick="render()">عرض بنفس الصورة</button>
<div id="out"></div>
</div>
</div>
<script>
let qr;
const NAMES={
"6224009210824":"جبنة رومي",
"6223001360056":"مياه Aquafina",
"6223000000000":"منتج مصري",
"4890000000000":"موبايل Infinix"
};
function getName(code){
if(NAMES[code]) return NAMES[code];
if(code.startsWith("622")) return "منتج مصري 622";
if(code.startsWith("628")) return "منتج سعودي 628";
if(code.startsWith("629")) return "منتج إماراتي 629";
return "منتج مستورد "+code.slice(0,3);
}
function render(){
let v=document.getElementById('q').value.trim();
if(!v) return;
let name=getName(v);
// أسعار وهمية ذكية عشان نفس الشكل يطلع في كل المنتجات
let carrefour=(Math.random()*5+16).toFixed(1);
let dist=(Math.random()*2+0.5).toFixed(1);
let amazon=(parseFloat(carrefour)+3.5).toFixed(0);
let jumia=(parseFloat(carrefour)+0.5).toFixed(0);
let isFood = v.startsWith("622") || name.includes("جبنة") || name.includes("مياه");
let ikeaText = isFood? `مش موجود ( ده أكل )` : `متوفر - ايكيا`;

document.getElementById('out').innerHTML=`
<div style="margin-top:16px;text-align:right;line-height:2">
<div class="barcode">${v} <span>${name}</span></div>
<div class="line"><span>أرخص سعر: كارفور <b class="pink">${carrefour}ج</b> ( <b style="color:#fb7185">${dist}</b> كم منك )</span></div>
<div class="line"><span>أمازون: <b>${amazon}ج</b></span></div>
<div class="line"><span>جوميا: <b>${jumia}ج</b></span></div>
<div class="line"><span>‹EA: ${ikeaText}</span></div>
<div class="small">✔ ${v.startsWith("622")?"مصري 622 🇪🇬 - صنع في مصر":"مستورد"} |
<a href="https://www.carrefouregypt.com/search?q=${v}" target="_blank">كارفور</a> -
<a href="https://www.amazon.eg/s?k=${v}" target="_blank">أمازون</a> -
<a href="https://www.jumia.com.eg/catalog/?q=${v}" target="_blank">جوميا</a></div>
</div>`;
}
function startScan(){
document.getElementById('reader').style.display='block';
if(!qr) qr=new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:260},d=>{document.getElementById('q').value=d;qr.stop();document.getElementById('reader').style.display='none';render();},()=>{});
}
render();
</script></body></html>
